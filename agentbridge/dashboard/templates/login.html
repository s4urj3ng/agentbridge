{% extends "base.html" %}
{% block title %}Sign in · AgentBridge{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>Sign in</h1>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <p><input type="password" name="token" placeholder="Admin token" autocomplete="current-password" style="width:100%" required></p>
    <button class="primary">Sign in</button>
  </form>
  <p class="muted">The token is <code>AGENTBRIDGE_ADMIN_TOKEN</code> on the server.</p>
</div>
{% endblock %}
