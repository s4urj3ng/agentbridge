{% extends "base.html" %}
{% block title %}Đăng nhập · AgentBridge{% endblock %}
{% block body %}
<div class="card" style="max-width:400px;margin:64px auto;padding:24px">
  <h1>Đăng nhập</h1>
  <p class="sub">Dashboard điều khiển AgentBridge.</p>
  {% if error %}<p class="chip bad" style="margin:0 0 12px">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="token" placeholder="Admin token" autocomplete="current-password" style="width:100%" required autofocus>
    <button class="primary" style="width:100%;margin-top:10px">Đăng nhập</button>
  </form>
  <p class="muted small" style="margin:14px 0 0">Token là <code>AGENTBRIDGE_ADMIN_TOKEN</code> trong <code>/etc/agentbridge/agentbridge.env</code> trên server.</p>
</div>
{% endblock %}
