# AgentBridge configuration (no secrets here: secrets live in agentbridge.env).
bind_host: 127.0.0.1
port: 8787
poll_interval_s: 2.0

limits:
  max_task_depth: 2
  max_tasks_per_milestone: 20
  max_revisions: 3
  max_validation_retries: 2
  max_concurrent_agents: 3          # N100: keep total concurrent agent CLIs low
  default_task_timeout_s: 1800
  tech_lead_timeout_s: 600
  max_event_attempts: 3
  max_quota_requeues: 3
  max_tl_invocations_per_milestone: 60
  max_execution_failures: 3

protected_branches: [main, master, "release/*", production, stable]
validation_executables: [python, python3, pytest, make, npm, node, cargo, go, ruff, mypy, sh, bash, git, "true", "false"]

github:
  enabled: false                    # set true after `gh auth login` as the agentbridge user
  gh_executable: gh

agents:
  # Work allocation (docs/ALLOCATION.md). rolling_limits are YOUR ceilings per provider window
  # (5 h / weekly), not the providers' real quotas; tune them after watching the Agents page.
  # fallback_to: when an agent is out of quota (cooldown, window full, budget, circuit open), the
  # work goes to the first admitted fallback instead of waiting or draining a weekly pool.

  # --- Tech Lead: Claude Team, Opus 5.5 medium. Called only on events, never polled.
  - id: claude-team-lead
    provider: claude
    roles: [tech_lead]
    config_dir: /var/lib/agentbridge/identities/claude-team-lead
    model: claude-opus-5-5
    effort: medium
    max_concurrency: 1
    rolling_limits: [{hours: 5, max: 30}, {hours: 168, max: 200}]

  # --- Default worker: Antigravity Gemini 3.8 Flash (high). Falls back to Argon 4 when it is not enough.
  - id: antigravity-worker
    provider: antigravity
    roles: [worker]
    model: gemini-3.8-flash-high
    fallback_to: [antigravity-argon]
    profile: "DEFAULT worker (Gemini 3.8 Flash high). Cheap and abundant. Routine implementation, tests, docs, research."
    max_concurrency: 2
    rolling_limits: [{hours: 5, max: 60}]

  # --- Antigravity Gemini 4 Argon (weekly quota): used when Gemini 3.8 Flash is not enough.
  - id: antigravity-argon
    provider: antigravity
    roles: [worker, reviewer]
    model: gemini-4-argon-high
    profile: "Weekly quota. Use when Gemini 3.8 Flash is not enough: harder tasks, or tasks that failed on Flash. Also a fallback reviewer."
    max_concurrency: 1
    rolling_limits: [{hours: 168, max: 60}]

  # --- Preferred reviewer: Claude Opus 5.5 medium INSIDE Antigravity (small external-model quota).
  # Keep its 5 h cap tight; when the 5 h window is full, reviews move to the fallbacks instead of
  # waiting into the next window or eating the weekly allowance.
  - id: antigravity-claude-reviewer
    provider: antigravity
    roles: [reviewer]
    model: claude-opus-5-5-medium
    allow_external_models: true
    fallback_to: [antigravity-argon, codex-reviewer]
    profile: "PREFERRED reviewer for run results (Claude Opus 5.5 medium via Antigravity). Small quota: request it first; AgentBridge reroutes automatically when its 5 h window is full."
    max_concurrency: 1
    rolling_limits: [{hours: 5, max: 6}, {hours: 168, max: 40}]

  # --- Claude Personal (Pro), Opus 5.5 medium: scarce, hard coding tasks only.
  - id: claude-personal-worker
    provider: claude
    roles: [worker]
    config_dir: /var/lib/agentbridge/identities/claude-personal-worker
    model: claude-opus-5-5
    effort: medium
    permission_mode: acceptEdits
    fallback_to: [antigravity-argon]
    profile: "SCARCE (5h + weekly), Claude Opus 5.5 medium. Only complex or risky code, multi-file changes, subtle bugs, or tasks that failed on the Gemini workers."
    max_concurrency: 1
    rolling_limits: [{hours: 5, max: 12}, {hours: 168, max: 70}]

  # --- Codex 6.1 high: scarce (5h + weekly). Independent second opinion for high-risk changes,
  # and last fallback reviewer. Confirm the exact model id in `codex` (/model) on the server.
  - id: codex-reviewer
    provider: codex
    roles: [reviewer]
    codex_home: /var/lib/agentbridge/.codex
    model: gpt-6.1
    reasoning_effort: high
    profile: "SCARCE (5h + weekly), Codex 6.1 high. Independent second opinion ONLY for high-risk changes (boot path, stubs, memory maps, security-sensitive code)."
    max_concurrency: 1
    rolling_limits: [{hours: 5, max: 4}, {hours: 168, max: 25}]

  # --- Optional official Gemini CLI (separately authenticated). Unverified until installed.
  - id: gemini-cli-worker
    provider: gemini
    roles: [worker]
    enabled: false

  # --- Mindlogic (아주LLM) API Gateway: ONE key (MINDLOGIC_API_KEY in agentbridge.env), many models.
  # Text-only reviewers via the OpenAI-compatible endpoint. Never a Tech Lead fallback.
  # credit_floor: refuse calls once the REAL balance (GET /credits/) drops below it.
  # Check model ids with `agentbridge agents detect` (it reads the key's /models list).
  - id: mindlogic-gpt-reviewer
    provider: mindlogic
    roles: [reviewer]
    enabled: false
    base_url: https://factchat-cloud.mindlogic.ai/v1/gateway
    model: gpt-5.6-sol
    api_key_env: MINDLOGIC_API_KEY
    credit_floor: 1500
    daily_invocation_limit: 15
  - id: mindlogic-gemini-reviewer
    provider: mindlogic
    roles: [reviewer]
    enabled: false
    base_url: https://factchat-cloud.mindlogic.ai/v1/gateway
    model: gemini-3.7-flash
    api_key_env: MINDLOGIC_API_KEY
    credit_floor: 1500
    daily_invocation_limit: 15

  # --- Claude Code running on Mindlogic credits (Anthropic-native gateway endpoint).
  # A real file-editing worker; separate config dir, never mixed with a subscription login.
  - id: claude-mindlogic-worker
    provider: claude
    roles: [worker]
    enabled: false
    api_base_url: https://factchat-cloud.mindlogic.ai/v1/gateway/claude
    auth_token_env: MINDLOGIC_API_KEY
    config_dir: /var/lib/agentbridge/identities/claude-mindlogic
    model: claude-sonnet-5-5
    max_concurrency: 1
    daily_invocation_limit: 10

  # --- Mock identities for the demo / smoke tests (no quota).
  - {id: mock-lead, provider: mock, roles: [tech_lead]}
  - {id: mock-worker, provider: mock, roles: [worker], max_concurrency: 2}
  - {id: mock-worker-b, provider: mock, roles: [worker]}
  - {id: mock-reviewer, provider: mock, roles: [reviewer], daily_invocation_limit: 50, reserved_review_invocations: 5}
