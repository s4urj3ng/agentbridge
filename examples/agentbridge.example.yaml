# AgentBridge configuration (no secrets here: secrets live in agentbridge.env).
bind_host: 127.0.0.1
port: 8787
poll_interval_s: 2.0

limits:
  max_task_depth: 2
  max_tasks_per_milestone: 20
  max_revisions: 3
  max_validation_retries: 2
  max_concurrent_agents: 3          # N100: keep total concurrent agent CLIs low
  default_task_timeout_s: 1800
  tech_lead_timeout_s: 600
  max_event_attempts: 3
  max_quota_requeues: 3
  max_tl_invocations_per_milestone: 60
  max_execution_failures: 3

protected_branches: [main, master, "release/*", production, stable]
validation_executables: [python, python3, pytest, make, npm, node, cargo, go, ruff, mypy, sh, bash, git, "true", "false"]

github:
  enabled: false                    # set true after `gh auth login` as the agentbridge user
  gh_executable: gh

agents:
  # Work allocation (see docs/ALLOCATION.md). rolling_limits are YOUR ceilings to spread usage
  # across the providers' 5-hour / weekly windows. They are not the providers' real quotas; tune
  # them after watching `agentbridge agents list` / the Agents page. Provider limit errors still
  # trigger an automatic cooldown on top of these.

  # --- Tech Lead: Claude Team. Light model for routine events, strong model only for planning
  # and unblocking. Called only on events, never polled.
  - id: claude-team-lead
    provider: claude
    roles: [tech_lead]
    config_dir: /var/lib/agentbridge/identities/claude-team-lead
    model: sonnet
    event_models: {GOAL_SUBMITTED: opus, VALIDATION_EXHAUSTED: opus, TASK_BLOCKED: opus, HUMAN_DECISION: opus}
    max_concurrency: 1
    rolling_limits: [{hours: 5, max: 25}, {hours: 168, max: 150}]

  # --- Default worker: Antigravity Gemini 3.8 Flash. Cheap and abundant.
  - id: antigravity-worker
    provider: antigravity
    roles: [worker, reviewer]
    model: gemini-3.8-flash-high
    profile: "DEFAULT worker. Cheap and abundant (5h + weekly windows, rarely exhausted). Use for routine implementation, tests, docs, refactors with clear specs, research."
    max_concurrency: 2
    rolling_limits: [{hours: 5, max: 60}]

  # --- Antigravity Gemini 4 Argon: weekly quota. Reviewer first, second choice for hard work.
  - id: antigravity-argon
    provider: antigravity
    roles: [reviewer, worker]
    model: gemini-4-argon-high
    profile: "Weekly quota. Preferred independent REVIEWER for non-trivial changes; second choice for hard tasks when Claude is busy or cooling down."
    max_concurrency: 1
    rolling_limits: [{hours: 168, max: 60, reserve_for_review: 30}]

  # --- Claude Personal (Pro): scarce (5h + weekly). Only for the hard tasks.
  - id: claude-personal-worker
    provider: claude
    roles: [worker]
    config_dir: /var/lib/agentbridge/identities/claude-personal-worker
    model: sonnet
    permission_mode: acceptEdits
    profile: "SCARCE (5h + weekly). Only complex or risky code, multi-file changes, subtle bugs, or a task that already failed on the default worker."
    max_concurrency: 1
    rolling_limits: [{hours: 5, max: 12}, {hours: 168, max: 70}]

  # --- Codex: scarce (5h + weekly). Independent second-opinion review for high-risk changes only.
  - id: codex-reviewer
    provider: codex
    roles: [reviewer]
    codex_home: /var/lib/agentbridge/.codex
    profile: "SCARCE (5h + weekly). Independent second opinion ONLY for high-risk changes (boot path, stubs, memory maps, security-sensitive code)."
    max_concurrency: 1
    rolling_limits: [{hours: 5, max: 4}, {hours: 168, max: 25}]

  # --- Optional official Gemini CLI (separately authenticated). Unverified until installed.
  - id: gemini-cli-worker
    provider: gemini
    roles: [worker]
    enabled: false

  # --- Mindlogic (아주LLM) API Gateway: ONE key (MINDLOGIC_API_KEY in agentbridge.env), many models.
  # Text-only reviewers via the OpenAI-compatible endpoint. Never a Tech Lead fallback.
  # credit_floor: refuse calls once the REAL balance (GET /credits/) drops below it.
  # Check model ids with `agentbridge agents detect` (it reads the key's /models list).
  - id: mindlogic-gpt-reviewer
    provider: mindlogic
    roles: [reviewer]
    enabled: false
    base_url: https://factchat-cloud.mindlogic.ai/v1/gateway
    model: gpt-5.6-sol
    api_key_env: MINDLOGIC_API_KEY
    credit_floor: 1500
    daily_invocation_limit: 15
  - id: mindlogic-gemini-reviewer
    provider: mindlogic
    roles: [reviewer]
    enabled: false
    base_url: https://factchat-cloud.mindlogic.ai/v1/gateway
    model: gemini-3.7-flash
    api_key_env: MINDLOGIC_API_KEY
    credit_floor: 1500
    daily_invocation_limit: 15

  # --- Claude Code running on Mindlogic credits (Anthropic-native gateway endpoint).
  # A real file-editing worker; separate config dir, never mixed with a subscription login.
  - id: claude-mindlogic-worker
    provider: claude
    roles: [worker]
    enabled: false
    api_base_url: https://factchat-cloud.mindlogic.ai/v1/gateway/claude
    auth_token_env: MINDLOGIC_API_KEY
    config_dir: /var/lib/agentbridge/identities/claude-mindlogic
    model: claude-sonnet-5-5
    max_concurrency: 1
    daily_invocation_limit: 10

  # --- Mock identities for the demo / smoke tests (no quota).
  - {id: mock-lead, provider: mock, roles: [tech_lead]}
  - {id: mock-worker, provider: mock, roles: [worker], max_concurrency: 2}
  - {id: mock-worker-b, provider: mock, roles: [worker]}
  - {id: mock-reviewer, provider: mock, roles: [reviewer], daily_invocation_limit: 50, reserved_review_invocations: 5}
