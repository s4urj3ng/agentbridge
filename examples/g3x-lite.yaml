# G3X Lite — Canon PowerShot G3 X GM1.10C CHDK port.
# Owner decision 2026-10-28: unattended runs. auto_start + autonomous: goals start at once and the
# Tech Lead keeps going (retry / revise / reassign, Codex reviews every task) without asking.
# Since 2026-10-30 the Tech Lead also approves (policy.self_approve). Hardware policy: STRICT NO-GO.
project:
  slug: g3x-lite
  name: G3X Lite (CHDK port, PowerShot G3 X GM1.10C)
  repo_path: /srv/agentbridge/repos/g3x-lite      # git clone https://github.com/s4urj3ng/g3x-lite
  remote_url: https://github.com/s4urj3ng/g3x-lite
  base_branch: main
  tech_lead: claude-team-lead
  default_worker: antigravity-worker          # Gemini 3.8 Flash high; falls back to Argon 4
  workers: [antigravity-argon, claude-personal-worker]
  reviewers: [antigravity-claude-reviewer, antigravity-argon, codex-reviewer]   # first = preferred
  review_policy: always                       # every task gets an independent review before approval
  review_risk_paths: ["chdk-port/**", "**/*.S", "**/stubs_*", "tools/**"]

validation:
  # Offline suites only. Reviewed 2026-10-27 against origin/main 16b954a and run on a clean clone
  # on the N100.
  # - bootstrap: tools/bootstrap_chdk_platform.py (PORT-8A) recreates the Git-ignored
  #   chdk-port/platform/g3x sources from vendor/ (stdlib, no network/subprocess/compiler,
  #   hash-checked). Every AgentBridge worktree is a fresh checkout without ignored files, so it
  #   runs first each time. Its output is Git-ignored and never enters a commit.
  # - test_port7a/7b/7c, test_port8a, test_port9a: stdlib, no ROM, no compiler (7a/7c need bootstrap).
  # - test_early_boot_literals, test_validate_hdmi001: ROM tiers skip when firmware/dumps is absent.
  # EXCLUDED: test_validate_witness_inspector.py (builds a camera payload binary with an ARM
  # compiler: STRICT NO-GO) and test_restart_sd_audit.py (its tier-3 test depends on the
  # local-only tools/build_prototype.py and fails on any clean clone; its ROM tiers skip anyway).
  commands:
    bootstrap: ["python3", "-B", "tools/bootstrap_chdk_platform.py"]
    port_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_port*.py"]
    audit_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_early*.py"]
    hdmi_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_validate_hdmi*.py"]
    port9_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_port9*.py", "-v"]
  default: [bootstrap, port_tests, audit_tests, hdmi_tests]
  timeout_s: 900

policy:
  hardware_policy: STRICT_NO_GO      # denies flashing, camera ops, SD writes, boot manipulation, deployment, hardware trials
  hardware_no_go: [firmware_flashing, camera_operations, sd_card_writing, boot_manipulation, firmware_deployment, hardware_trial]
  auto_start: true
  autonomous: true
  # When a milestone completes, the Tech Lead plans and starts the next one (or stops with
  # NO_FURTHER_WORK). New milestones stack on the previous integration branch until it is merged.
  auto_next: true
  auto_next_max_per_day: 6
  stack_on_unmerged: true
  # Owner decision 2026-10-30: the Tech Lead approves for the owner (draft PRs, scope changes,
  # next milestone). Merging into main stays with the owner.
  self_approve: true
  draft_pr: auto
  # chdk-port/** is firmware-side source (boot_prototype.c, stubs): read-only for offline milestones.
  # AGENTS.md is the owner's agent contract: agents never edit it. Relax only by owner decision.
  forbidden_paths: [".github/workflows/**", "firmware/**", "**/*.bin", "**/*.FI2", "**/*.fi2", "**/*.fir",
                    "**/*.rom", "**/*.elf", "**/*.o", "**/DISKBOOT.BIN", "patches/**", "vendor/**",
                    "chdk-port/**", "AGENTS.md", "**/*.pem", "**/.env"]
  protected_branches: [main, master, "release/*"]
  max_changed_files: 40

limits:
  max_task_depth: 1
  max_tasks_per_milestone: 200     # owner: unattended runs should not stop on a task count
  max_revisions: 8                 # autonomous mode: room for review/revise cycles

charter: |
  Port CHDK to the Canon PowerShot G3 X running firmware GM1.10C. Work is strictly offline:
  source, build tooling, static analysis within the approved scope, and host-side tests.
  Restricted firmware analysis outside the approved scope is not allowed.
  Repository rules: AGENTS.md and docs/SAFETY.md apply. Label every claim VERIFIED / INFERRED /
  UNKNOWN with exact citations. Never infer firmware addresses, offsets or CPU mode without
  evidence. ROM reads need explicit owner approval of an exact byte range and are impossible on
  the AgentBridge host (no firmware/ files there). Local-only sources (untracked/Git-ignored L1/L2
  in PORT-9A) are not available on the AgentBridge clone; do not cite them as checkable.
context:
  - "Hardware policy is STRICT NO-GO: no flashing, camera operations, SD-card writing, boot changes, deployment or hardware trials."
  - "Never run tests/test_validate_witness_inspector.py or tools/build_witness_inspector.py: they build a camera payload binary."
  - "chdk-port/platform/g3x is Git-ignored; AgentBridge recreates it in every worktree with tools/bootstrap_chdk_platform.py before tests. Never edit those generated files."
  - "PORT-9A delivered tools/port9a_runtime_lifecycle.py (stdlib state model), 32 tests and docs/PORT9A_RUNTIME_INTEGRATION_MAP.md: interfaces I1-I4 modelled, all GM1.10C preconditions False, unknowns U1-U7."
  - "docs/PROJECT_STATE.md and docs/HANDOFF.md were last updated for PORT-5E; PORT-7B..9A are recorded in git history and their own docs."
  - "Candidate next milestone: PORT-9B — offline runtime integration contracts. The owner delegated the go/no-go to the Tech Lead (2026-10-30); check first whether PR #11 (tools/port9b_runtime_contract.py) already covers it."
completed_milestones: [PORT-7B, PORT-7C, PORT-8A, PORT-9A]
