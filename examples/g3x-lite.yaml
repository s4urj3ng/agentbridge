# G3X Lite — Canon PowerShot G3 X GM1.10C CHDK port.
# Owner decision 2026-10-28: unattended runs. auto_start + autonomous: goals start at once and the
# Tech Lead keeps going (retry / revise / reassign, Codex reviews every task) without asking.
# Since 2026-10-30 the Tech Lead also approves and merges (policy.self_approve / self_merge).
# First-boot path (owner decision 2026-10-30): agents may read the ROM dump, edit the tracked boot
# prototype and build first-boot candidates. Flashing, SD-card writes, anything on the camera and
# hardware trials stay forbidden: the owner runs every trial by hand.
project:
  slug: g3x-lite
  name: G3X Lite (CHDK port, PowerShot G3 X GM1.10C)
  repo_path: /srv/agentbridge/repos/g3x-lite      # git clone https://github.com/s4urj3ng/g3x-lite
  remote_url: https://github.com/s4urj3ng/g3x-lite
  base_branch: main
  tech_lead: claude-team-lead
  default_worker: antigravity-worker          # Gemini 3.8 Flash high; falls back to Argon 4
  workers: [antigravity-argon, claude-personal-worker]
  reviewers: [antigravity-claude-reviewer, antigravity-argon, codex-reviewer]   # first = preferred
  review_policy: always                       # every task gets an independent review before approval
  review_risk_paths: ["chdk-port/**", "**/*.S", "**/stubs_*", "tools/**"]
  # Local-only files mirrored from the owner's Mac checkout (read-only, never committed): ROM dump
  # firmware/dumps/GM1.10C/PRIMARY.BIN, the full CHDK tree under chdk-port/, local build/validate
  # scripts in tools/, local research docs, candidate_port2a/ (pre-correction), and
  # toolchains/gcc-arm-none-eabi-5_4-2016q3 (Linux build of the pinned compiler).
  local_overlay: /var/lib/agentbridge/g3x-local/overlay

validation:
  # Offline suites only. Reviewed 2026-10-27 against origin/main 16b954a and run on a clean clone
  # on the N100.
  # - bootstrap: tools/bootstrap_chdk_platform.py (PORT-8A) recreates the Git-ignored
  #   chdk-port/platform/g3x sources from vendor/ (stdlib, no network/subprocess/compiler,
  #   hash-checked). Every AgentBridge worktree is a fresh checkout without ignored files, so it
  #   runs first each time. Its output is Git-ignored and never enters a commit.
  # - test_port7a/7b/7c, test_port8a, test_port9a: stdlib, no ROM, no compiler (7a/7c need bootstrap).
  # - test_early_boot_literals, test_validate_hdmi001: ROM tiers skip when firmware/dumps is absent.
  # EXCLUDED: test_validate_witness_inspector.py (builds a camera payload binary with an ARM
  # compiler: STRICT NO-GO) and test_restart_sd_audit.py (its tier-3 test depends on the
  # local-only tools/build_prototype.py and fails on any clean clone; its ROM tiers skip anyway).
  commands:
    bootstrap: ["python3", "-B", "tools/bootstrap_chdk_platform.py"]
    port_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_port*.py"]
    audit_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_early*.py"]
    hdmi_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_validate_hdmi*.py"]
    port9_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_port9*.py", "-v"]
    # first-boot path: builds and checks candidates (nothing leaves the host)
    witness_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_validate_witness*.py"]
    restart_sd_tests: ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_restart_sd*.py"]
    candidate_build: ["python3", "-B", "tools/build_candidate_port2a.py"]
    candidate_validate: ["python3", "-B", "tools/validate_candidate_port2a.py"]
  default: [bootstrap, port_tests, audit_tests, hdmi_tests]
  timeout_s: 900

policy:
  # boot_manipulation is allowed (boot prototype edits, DISKBOOT candidate builds on the host);
  # everything that touches the camera or an SD card is not.
  hardware_policy: none
  hardware_no_go: [firmware_flashing, camera_operations, sd_card_writing, firmware_deployment, hardware_trial]
  auto_start: true
  autonomous: true
  # When a milestone completes, the Tech Lead plans and starts the next one (or stops with
  # NO_FURTHER_WORK). New milestones stack on the previous integration branch until it is merged.
  auto_next: true
  auto_next_max_per_day: 6
  stack_on_unmerged: true
  # Owner decision 2026-10-30: the Tech Lead approves for the owner (draft PRs, scope changes,
  # next milestone) and merges milestone PRs into main when it judges them sound (self_merge).
  self_approve: true
  self_merge: true
  draft_pr: auto
  # A task sent back 3 times moves to Claude Personal (Opus 5.5) for its next revision.
  escalate_after_revisions: 3
  escalation_worker: claude-personal-worker
  # The tracked boot prototype (chdk-port/platform/g3x/sub/110c/*) and the payload/loader sources
  # in firmware/tools (.S, .m, .json) are editable since 2026-10-30. Build outputs, ROM bytes and
  # toolchains are never committed. AGENTS.md is the owner's contract.
  forbidden_paths: [".github/workflows/**", "firmware/dumps/**", "**/*.bin", "**/*.BIN", "**/*.FI2", "**/*.fi2", "**/*.fir",
                    "**/*.rom", "**/*.elf", "**/*.o", "**/*.a", "**/DISKBOOT.BIN", "patches/**", "vendor/**",
                    "toolchains/**", "candidate_port2a/**", "AGENTS.md", "**/*.pem", "**/.env"]
  protected_branches: [main, master, "release/*"]
  max_changed_files: 40

limits:
  max_task_depth: 1
  max_tasks_per_milestone: 200     # owner: unattended runs should not stop on a task count
  max_revisions: 8                 # autonomous mode: room for review/revise cycles

charter: |
  Port CHDK to the Canon PowerShot G3 X running firmware GM1.10C. Current objective (owner,
  2026-10-30): reach the first boot, i.e. a corrected first-boot witness candidate (DISKBOOT.BIN
  plus witness inspector) that the owner can try on the camera by hand, with a written trial and
  recovery plan for the owner.
  Allowed on the host: reading the GM1.10C ROM dump (firmware/dumps/GM1.10C/PRIMARY.BIN, present in
  every worktree), editing the tracked boot prototype (chdk-port/platform/g3x/sub/110c/), building
  candidates with the pinned toolchain (toolchains/gcc-arm-none-eabi-5_4-2016q3) and the local
  build scripts, and host-side tests. The Tech Lead decides which ROM ranges a task reads; record
  every range read (start, length, SHA-256) in an evidence manifest checked with
  tools/port11c_evidence_validator.py. Never commit ROM bytes, build outputs or binaries. No
  full-ROM scans.
  Never: flashing, SD-card writes, connecting to or running anything on the camera, hardware
  trials. The owner runs every trial and reports the result.
  Repository rules: AGENTS.md and docs/SAFETY.md apply. Label every claim VERIFIED / INFERRED /
  UNKNOWN with exact citations. Never infer firmware addresses, offsets or CPU mode without
  evidence.
context:
  - "First-boot path open (owner, 2026-10-30): ROM reads, boot prototype edits and host-side candidate builds are allowed. Flashing, SD-card writes, camera operations and hardware trials are not: the owner does those by hand."
  - "Building payloads/candidates is allowed on the host (tools/build_witness_inspector.py, tools/build_candidate_port2a.py, witness_tests / candidate_build / candidate_validate validation names). Outputs stay untracked."
  - "Local-only files are mirrored into every worktree from the owner's Mac (read-only hard links, git-excluded): full CHDK tree in chdk-port/, local tools/*.py, local docs (L1/L2 research), candidate_port2a/ (PRE-CORRECTION). To change a local-only tool, write a new tracked file instead of editing the link."
  - "chdk-port/platform/g3x is Git-ignored; AgentBridge recreates it in every worktree with tools/bootstrap_chdk_platform.py before tests. Never edit those generated files."
  - "PORT-9A delivered tools/port9a_runtime_lifecycle.py (stdlib state model), 32 tests and docs/PORT9A_RUNTIME_INTEGRATION_MAP.md: interfaces I1-I4 modelled, all GM1.10C preconditions False, unknowns U1-U7."
  - "docs/PROJECT_STATE.md and docs/HANDOFF.md were last updated for PORT-5E; PORT-7B..9A are recorded in git history and their own docs."
  - "Earlier recommended step PORT-10A (bounded ROM verification of U1-U3) is now possible on the host; candidate_port2a/ predates the SD1stInit and PORT-5E fixes and must be rebuilt before any trial."
completed_milestones: [PORT-7B, PORT-7C, PORT-8A, PORT-9A]
